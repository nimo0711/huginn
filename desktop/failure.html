<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forkrail</title>
  <style>
    html { color-scheme: dark; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0c0e16; color: #eeeeee; font: 14px/1.55 "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; }
    main { margin: 20px; padding: 32px; border-radius: 16px; background: #14171d; overflow-wrap: anywhere; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    p { margin: 8px 0 0; }
  </style>
</head>
<body>
  <main id="forkrail-start-error" role="alert">
    <h1>Forkrail을 시작할 수 없습니다</h1>
    <p>{{.}}</p>
    <p>원인을 확인한 다음 Forkrail을 다시 열어 주세요.</p>
  </main>
</body>
</html>
