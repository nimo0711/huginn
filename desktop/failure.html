<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huginn</title>
  <style>
    {{template "theme"}}
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 14px/1.55 "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; }
    main { margin: 20px; padding: 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); overflow-wrap: anywhere; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    p { margin: 8px 0 0; }
  </style>
</head>
<body>
  <main id="forkrail-start-error" role="alert">
    <h1>Huginn을 시작할 수 없습니다</h1>
    <p>{{.}}</p>
    <p>원인을 확인한 다음 Huginn을 다시 열어 주세요.</p>
  </main>
</body>
</html>
