<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 기록 · 작업 보드</title>
<style>
:root{--bg:#0c0e16;--panel:#14171d;--hover:#1d222b;--text:#eeeeee;--sub:#b8b8b8;--faint:#a7a7a7;--line:#2c2c2c;--line2:#2c2c2c;--accent:#4c6df1;--good:#83dea9;--goodbg:#83dea90f;--warn:#f6b72f;--warnbg:#f6b72f0f;--hold:#a7a7a7;--holdbg:#1d222b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 48px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
header h1{font-size:22px;margin:0}
header .sub{color:var(--faint);font-size:14px}
header .hl{display:flex;align-items:baseline;gap:16px}
header .back{color:var(--faint);font-size:14px;text-decoration:none}
header .back:hover{color:inherit;text-decoration:underline}
h2{font-size:16px;color:var(--sub);font-weight:600;margin:28px 0 10px}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.sess{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sess.idle{color:var(--sub)}
.sess .who{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--sub)}
.agent{font-size:13px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:0 8px;line-height:20px}
.sess .where{font-weight:600;margin-top:6px}
.sess .doing{font-size:15px;color:var(--sub);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:14px;font-weight:500}
.tabs button.on{background:var(--hover);border-color:var(--line2);color:var(--text)}
.head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:12px}
.head .title{font-size:20px;font-weight:600;line-height:1.4}
.head .meta{display:flex;gap:18px;margin-top:8px;color:var(--sub);font-size:15px;flex-wrap:wrap}
.head .meta b{color:var(--text);font-size:18px;margin-right:4px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:92px 1fr auto;gap:12px;align-items:center;padding:11px 16px}
.row summary::-webkit-details-marker{display:none}
.row summary:hover{background:var(--hover)}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{color:var(--faint);font-size:14px;white-space:nowrap}
.row .memo{padding:0 16px 14px 120px;color:var(--sub);font-size:16px}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;text-align:center;white-space:nowrap}
.pill.done{color:var(--good);background:var(--goodbg)}.pill.doing{color:var(--warn);background:var(--warnbg)}.pill.hold{color:var(--hold);background:var(--holdbg)}
.fold{margin-top:10px}
.fold>summary{cursor:pointer;color:var(--sub);font-size:15px;font-weight:600;padding:6px 2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .n{font-size:15px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.tile .x{font-size:26px;font-weight:600;color:var(--good);font-variant-numeric:tabular-nums}
.tile .x.slow{color:var(--warn)}
.tile .ba{font-size:15px;color:var(--sub);font-variant-numeric:tabular-nums}
.tl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 16px}
.tl .e{display:grid;grid-template-columns:100px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl .e:last-child{border-bottom:0}
.tl time{color:var(--faint);font-size:15px;font-variant-numeric:tabular-nums}
.tl .msg{min-width:0;overflow-wrap:anywhere}
.tl .msg summary{cursor:pointer;list-style:disclosure-closed;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .msg[open] summary{list-style:disclosure-open;white-space:normal}
.tl .msg p{margin:8px 0 0;white-space:pre-wrap}
.more{all:unset;cursor:pointer;display:block;text-align:center;color:var(--sub);font-weight:600;font-size:15px;padding:10px}
.empty{color:var(--faint);font-size:15px}
@media (max-width:700px){.row summary{grid-template-columns:76px 1fr}.row .k{display:none}.row .memo{padding-left:16px}.tl .e{grid-template-columns:1fr}}
body{font-size:14px}
header{flex-wrap:wrap;margin-bottom:20px}
header h1{font-size:24px}
header .hl{flex-wrap:wrap}
button,a[href],summary,select{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:active,summary:active{box-shadow:inset 0 0 0 1px currentColor}
.tabs button{border-radius:5px;min-height:36px}
.tabs button.on{border-color:var(--accent)}
.sessions{display:flex;flex-direction:column;gap:0;margin-top:12px}
.sess{padding:12px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.sess .doing{font-size:14px;overflow-wrap:anywhere}
.head,.list,.tl{border-radius:16px}
.head{padding:20px}
.metric-table{width:100%;border-collapse:collapse;margin-top:12px}
.metric-table th,.metric-table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);font-size:14px;overflow-wrap:anywhere}
.metric-table th{font-weight:500;color:var(--sub)}
.metric-table small{display:block;color:var(--faint);margin-top:4px}
.metric-table td:not(:first-child){font-variant-numeric:tabular-nums;white-space:nowrap}
.record-status{color:var(--sub);margin:12px 0}
.record-status:empty{display:none}
.tl time{font-size:12px}
.tl .e{grid-template-columns:88px minmax(0,1fr)}
.session-fold{margin:20px 0}
.session-fold>summary{color:var(--sub);padding:12px 0}
.memo{overflow-wrap:anywhere}
@media(max-width:820px){
 .wrap{padding:20px 16px 32px}
 a[href],button,summary{min-height:44px;align-content:center}
 a[href]{display:inline-flex;align-items:center}
 .tabs{gap:8px}
 .tabs button{padding:4px 12px}
 .row .t{white-space:normal;overflow-wrap:anywhere}
 .tl .e{grid-template-columns:minmax(0,1fr);gap:4px}
 .head .meta{gap:12px}
 .metric-table th,.metric-table td{padding:12px 4px;font-size:12px}
}
</style>
</head>
<body>
<main class="wrap">
<header><div class="hl"><a class="back" href="/">← 세션 현황</a><h1>작업 기록</h1></div><span class="sub" id="clock"></span></header>
<p class="record-status" id="load-status" role="status">작업 기록을 불러오는 중입니다.</p>
<details class="session-fold"><summary id="sessions-label">최근 기록한 세션</summary><div class="sessions" id="sessions"></div></details>
<h2>작업 선택</h2>
<div class="tabs" id="stories"></div>
<div id="main"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function storyFromLocation() { try { return decodeURIComponent(location.hash.slice(1)) || ''; } catch { return ''; } }
let selected = storyFromLocation();
let tlLimit = 15;
const openRows = new Set();

function ago(ts, now) {
  const s = Math.max(0, Math.round(now - ts));
  if (s < 60) return "방금";
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  return `${Math.floor(s / 86400)}일 전`;
}
function stamp(ts) {
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, "0");
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function stClass(s) {
  if (/완료|머지|합격/.test(s)) return "done";
  if (/보류|미실시|취소/.test(s)) return "hold";
  return "doing";
}
function stLabel(s) { return s.replace(/\(.*\)/, "").trim() || s; }
function agentBadge(a) {
  const cls = a === "claude" ? "claude" : a === "codex" ? "codex" : "other";
  return `<span class="agent ${cls}">${a === "claude" ? "Claude" : a === "codex" ? "Codex" : esc(a || "?")}</span>`;
}
function splitItem(item) {
  const [name, key] = item.split(" · ");
  return {name: name || item, key: key || ""};
}
function rowHtml(i) {
  const {name, key} = splitItem(i.item);
  const id = esc(i.item);
  return `<details class="row" data-id="${id}" ${openRows.has(i.item) ? "open" : ""}>
    <summary><span class="pill ${stClass(i.status)}">${esc(stLabel(i.status))}</span><span class="t">${esc(i.title || name)}</span><span class="k">${esc(name)}${key ? " · " + esc(key) : ""}</span></summary>
    ${i.message ? `<div class="memo">${esc(i.message)}</div>` : ""}
  </details>`;
}
function render(d) {
  const focused = document.activeElement;
  const focusStory = focused?.dataset.story;
  const focusRow = focused?.tagName === 'SUMMARY' ? focused.parentElement.dataset.id : null;
  const focusMore = focused?.id === 'more';
  $("clock").textContent = `${stamp(d.now)} · 5초마다 새로 고침`;
  const live = d.sessions.filter((s) => s.active);
  document.title = '작업 기록 · 작업 보드';
  $('sessions-label').textContent = `최근 기록한 세션 ${d.sessions.length}개 · 작업 중 ${live.length}개`;
  $("sessions").innerHTML = d.sessions.length ? d.sessions.map((s) => `
    <div class="sess ${s.active ? "" : "idle"}">
      <div class="who">${agentBadge(s.agent)}<span>${s.active ? "작업 중" : "쉬는 중"} · ${ago(s.last_ts, d.now)}</span></div>
      <div class="where">${esc(s.story || s.repo || "스토리 없음")}</div>
      <div class="doing">${esc(s.doing || "아직 기록 없음")}</div>
    </div>`).join("") : `<span class="empty">최근 6시간 안에 기록한 세션이 없습니다.</span>`;

  $("stories").innerHTML = d.stories.map((s) =>
    `<button class="${s.story === d.story ? "on" : ""}" aria-pressed="${s.story === d.story}" data-story="${esc(s.story)}">${esc(s.story)}</button>`).join("")
    || `<span class="empty">아직 작업 기록이 없습니다. 세션에서 wb로 기록하면 여기에 표시됩니다.</span>`;
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    selected = b.dataset.story; location.hash = encodeURIComponent(selected); tlLimit = 15; openRows.clear(); load();
  });
  if (!d.story) { $("main").innerHTML = ""; return; }

  const head = d.stories.find((s) => s.story === d.story) || {};
  const groups = {doing: [], hold: [], done: []};
  d.items.forEach((i) => groups[stClass(i.status)].push(i));

  const tileHtml = d.metrics.map(m => `<tr><td>${esc(m.metric)}<small>${esc(m.item)}${m.message ? ' · '+esc(m.message) : ''}</small></td><td>${esc(m.before_value)}</td><td>${esc(m.after_value)}</td></tr>`).join('');

  const tl = d.timeline.slice(0, tlLimit).map((e) => {
    let text = String(e.message || e.title || '');
    if (e.kind === "status") text = `${splitItem(e.item).name} ${stLabel(e.status)}${e.message ? " · " + e.message : ""}`;
    if (e.kind === "metric") text = `${e.metric} ${e.before_value} → ${e.after_value}`;
    const id = 'event:'+e.ts+':'+(e.id || e.item || '')+':'+e.kind;
    return `<div class="e"><time>${stamp(e.ts)}</time>${text.length>90 ? `<details class="msg" data-id="${esc(id)}" ${openRows.has(id)?'open':''}><summary>${esc(text.slice(0,90))}…</summary><p>${esc(text)}</p></details>` : `<div class="msg">${esc(text)}</div>`}</div>`;
  }).join("");

  $("main").innerHTML = `
    <div class="head">
      <div class="title">${esc(head.title || d.story)}</div>
      <div class="meta"><span><b>${groups.doing.length}</b>진행 중</span><span><b>${groups.hold.length}</b>보류</span><span><b>${groups.done.length}</b>완료</span>${head.status ? `<span class="pill ${stClass(head.status)}">${esc(head.status)}</span>` : ""}<span>마지막 기록 ${ago(head.last_ts || d.now, d.now)}</span></div>
    </div>
    <h2>항목</h2>
    ${groups.doing.length + groups.hold.length ? `<div class="list">${[...groups.doing, ...groups.hold].map(rowHtml).join("")}</div>` : `<span class="empty">진행 중인 항목이 없습니다.</span>`}
    ${groups.done.length ? `<details class="fold" ${openRows.has("__done") ? "open" : ""} data-id="__done"><summary>완료 ${groups.done.length}개 펼치기</summary><div class="list">${groups.done.map(rowHtml).join("")}</div></details>` : ""}
    ${d.metrics.length ? `<h2>변경 전후 측정</h2><table class="metric-table"><thead><tr><th scope="col">측정 항목·조건</th><th scope="col">변경 전</th><th scope="col">변경 후</th></tr></thead><tbody>${tileHtml}</tbody></table>` : ""}
    <h2>작업 기록</h2>
    ${tl ? `<div class="tl">${tl}</div>${d.timeline.length > tlLimit ? `<button class="more" id="more">이전 기록 더 보기</button>` : ""}` : `<span class="empty">기록이 없습니다.</span>`}`;

  document.querySelectorAll("details[data-id]").forEach((el) => el.ontoggle = () => {
    el.open ? openRows.add(el.dataset.id) : openRows.delete(el.dataset.id);
  });
  const more = $("more");
  if (more) more.onclick = () => { tlLimit += 30; load(); };
  const restored = focusStory ? [...document.querySelectorAll('[data-story]')].find(e=>e.dataset.story===focusStory)
    : focusRow ? [...document.querySelectorAll('details[data-id]')].find(e=>e.dataset.id===focusRow)?.querySelector('summary')
    : focusMore ? more : null;
  restored?.focus({preventScroll:true});
}

async function load() {
  const requested=selected;
  try {
    const r = await fetch(`/api/state?story=${encodeURIComponent(requested)}`, {cache: "no-store"});
    if (!r.ok) throw new Error('기록 조회 실패');
    const value=await r.json();if(selected!==requested)return;
    render(value);
    $('load-status').textContent = '';
  } catch (e) {
    if(selected!==requested)return;
    $('load-status').textContent = '작업 기록을 불러오지 못했습니다. 5초마다 다시 연결합니다.';
  }
}
function followStoryLocation() {
  const next=storyFromLocation();if(next===selected)return;
  selected=next;tlLimit=15;openRows.clear();load();
}
window.addEventListener('hashchange',followStoryLocation);
window.addEventListener('popstate',followStoryLocation);
load();
setInterval(() => { if (!document.querySelector(".tl .msg[open]")) load(); }, 5000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.target.closest("input,textarea"))location.href="/";});
</script>
</body>
</html>
