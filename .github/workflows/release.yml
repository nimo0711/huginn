name: Build Forkrail installers

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed:
        description: Sign and notarize using configured certificates
        type: boolean
        default: false
      publish_draft:
        description: Attach verified installers to a draft GitHub release
        type: boolean
        default: false
      tag:
        description: Existing version tag (required to create a release draft)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      FORKRAIL_SIGNED: ${{ inputs.signed && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate release version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUBLISH_DRAFT: ${{ inputs.publish_draft && '1' || '0' }}
        run: python scripts/check_release_request.py
      - name: Install build dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Ensure Microsoft WebView2 for real UI checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/ensure-webview2.ps1
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Frontend regression tests
        run: node --test tests/*.test.cjs
      - name: Desktop lifecycle and proxy tests
        working-directory: desktop
        run: go test ./...
      - name: Configure Apple signing on the disposable Mac
        if: inputs.signed && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python scripts/ci_signing.py setup
      - name: Configure Windows signing on the disposable Windows runner
        if: inputs.signed && runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: python scripts/ci_signing.py setup
      - name: Build installer and portable archive
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          FORKRAIL_WINDOWS_CERT_PASSWORD: ${{ runner.os == 'Windows' && inputs.signed && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: |
          if [ "$FORKRAIL_SIGNED" = 1 ]; then
            python scripts/build_release.py --target "$RELEASE_TARGET" --signed
          else
            python scripts/build_release.py --target "$RELEASE_TARGET"
          fi
      - name: Remove signing material before UI and upload
        if: always() && inputs.signed
        run: python scripts/ci_signing.py cleanup
      - name: Verify release files
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          if [ "$FORKRAIL_SIGNED" = 1 ]; then
            python scripts/verify_release.py "dist/$RELEASE_TARGET" --require-signed
          else
            python scripts/verify_release.py "dist/$RELEASE_TARGET"
          fi
      - name: Exercise packaged desktop and installer
        run: python scripts/smoke_release.py --target '${{ matrix.target }}'
      - name: Verify installer and WebView evidence
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/verify_release.py "dist/$RELEASE_TARGET" --target "$RELEASE_TARGET" --require-smoke --commit "$GITHUB_SHA"
      - name: Upload installers, checksums, and smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Forkrail-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_draft
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Verify every target and create a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORKRAIL_SIGNED: ${{ inputs.signed && '1' || '0' }}
        run: python3 scripts/publish_draft.py artifacts
