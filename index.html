<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forkrail</title>
<link rel="icon" type="image/png" href="/assets/brand.png">
<style>
:root {
  --bg: #111214; --side: #141517; --panel: #18191c; --panel2: #1e2023; --hover: #23252a; --line: rgba(236,236,238,.08); --line2: rgba(236,236,238,.14);
  --ink: #f2f2f4; --sub: #c4c6cb; --dim: #989ba2;
  --run: #f0b545; --wait: #e8866a; --stall: #d9645b; --off: #55585e; --done: #6fbf92;
  --ease: cubic-bezier(.22,1,.36,1); --info: #6c8cff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.55 "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; overflow: hidden; }
button, select { font: inherit; }
button:focus-visible, select:focus-visible, .tab:focus-visible { outline: 2px solid var(--line2); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100vh; }
.num { font-variant-numeric: tabular-nums; }

aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; user-select: none; -webkit-user-select: none; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 16px 16px 8px; }
.sum div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.sum b { display: block; font-size: 20px; line-height: 28px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }
.sum span { font-size: 13px; color: var(--dim); white-space: nowrap; }
.sum .w b { color: var(--wait); }
.sum .r b { color: var(--run); }
.sum .s b { color: var(--stall); }
.list { overflow: auto; padding: 0 8px 12px; flex: 1; }
.grp { font-size: 13px; font-weight: 500; color: var(--dim); padding: 20px 8px 8px; }
.tab { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; padding: 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: background-color .15s var(--ease); }
.tab + .tab { margin-top: 2px; }
.sc-tab.dragging { opacity: .4; }
.sc-tab.drop-before { box-shadow: inset 0 2px 0 var(--sub); }
.sc-tab.drop-after { box-shadow: inset 0 -2px 0 var(--sub); }
.tab:hover { background: var(--panel); }
.tab.sel { background: var(--panel2); border-color: var(--line); }
.av { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-weight: 500; font-size: 14px; color: var(--sub); background: var(--panel2); border: 1px solid var(--line); position: relative; font-variant-numeric: tabular-nums; }
.av::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--side); background: var(--off); }
.tab.sel .av::after { border-color: var(--panel2); }
.p-run .av::after { background: var(--run); }
.p-wait .av::after { background: var(--wait); }
.p-stall .av::after { background: var(--stall); }
.p-idle .av::after { background: var(--dim); }
.tab .n1 { display: flex; gap: 8px; align-items: baseline; }
.tab .nm { font-weight: 500; white-space: nowrap; }
.tab .stt { margin-left: auto; font-size: 13px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.p-run .stt { color: var(--run); }
.p-wait .stt { color: var(--wait); }
.p-stall .stt { color: var(--stall); }
.tab .rq { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .rq b { font-weight: 500; color: var(--ink); }
.ask-rq { color: var(--wait) !important; }
.mini, .mbar { display: flex; gap: 2px; }
.mini { margin-top: 8px; }
.mini i, .mbar i { flex: 1; height: 4px; border-radius: 2px; background: var(--line2); }
.mini i.done, .mbar i.done { background: var(--done); }
.mini i.now, .mbar i.now { background: var(--run); }
.mini i.wait, .mbar i.wait { background: var(--wait); }
.mini i.cut, .mbar i.cut { background: var(--stall); }
.sfx { font-style: normal; color: var(--dim); font-weight: 400; }
.side-foot { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.side-foot a { color: var(--dim); text-decoration: none; }
.side-foot a:hover { color: var(--sub); }

.main { position: relative; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 20px 24px 16px; gap: 12px; }
.top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.top .av { width: 36px; height: 36px; font-size: 15px; }
.top .av::after { border-color: var(--bg); }
.top .nm { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.badge { font-size: 13px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; line-height: 20px; }
.top .loc { color: var(--dim); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .stt { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--sub); white-space: nowrap; font-variant-numeric: tabular-nums; }
.top .stt::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
.top .stt.p-run::before { background: var(--run); animation: live 2s var(--ease) infinite; }
.top .stt.p-wait::before { background: var(--wait); }
.top .stt.p-stall::before { background: var(--stall); }
.top .stt.p-idle::before { background: var(--dim); }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(240,181,69,.45); } 70%, 100% { box-shadow: 0 0 0 6px rgba(240,181,69,0); } }

.askban { display: flex; gap: 12px; align-items: flex-start; border-radius: 12px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--wait); }
.use { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 8px; }
.use > div { min-width: 0; }
.use small { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; }
.use b { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.use em { display: block; font-style: normal; font-size: 12px; color: var(--dim); white-space: nowrap; }
.use em.old { color: var(--dim); }
.sprint-tab { margin-top: 8px; }
.sprint-tab .av { font-size: 12px; }
.sprint-tab .av::after, .av.sp::after { display: none; }
.sk { font-size: 14px; color: var(--sub); text-decoration: none; font-variant-numeric: tabular-nums; }
.sk:hover { color: var(--ink); text-decoration: underline; }
.stitle { font-size: 15px; line-height: 1.5; }
.tag { font-size: 12px; color: var(--dim); border: 1px solid var(--line2); border-radius: 4px; padding: 0 4px; margin-right: 6px; vertical-align: 1px; }
.sess { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line2); background: transparent; color: var(--sub); font-size: 13px; cursor: pointer; }
.sess:hover { color: var(--ink); }
.sess i { width: 6px; height: 6px; border-radius: 50%; background: var(--off); }
.sess i.p-run { background: var(--run); } .sess i.p-wait { background: var(--wait); } .sess i.p-stall { background: var(--stall); } .sess i.p-idle { background: var(--dim); }
.docs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.docs small { font-size: 13px; color: var(--dim); margin-right: 4px; }
.docs small em { font-style: normal; color: var(--sub); }
.doc { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 28px; padding: 0 10px 0 4px; border: 1px solid var(--line2); border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 14px; transition: border-color .15s cubic-bezier(.22,1,.36,1); }
.doc:hover { border-color: var(--sub); }
.doc .k { flex: none; font-size: 12px; color: var(--sub); background: var(--panel2); border-radius: 4px; padding: 2px 6px; }
.doc .f { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-ses .sess { margin: 2px 4px 2px 0; color: var(--ink); }
.none { color: var(--dim); font-size: 13px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.wh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.wh b { font-size: 15px; font-weight: 600; }
.wh span { font-size: 13px; color: var(--sub); }
.dash-wrap { flex: 1; min-height: 640px; display: grid; grid-template-rows: auto auto minmax(250px, 1fr) minmax(250px, 1fr); gap: 16px; }
.dh { display: flex; align-items: baseline; gap: 12px; }
.dh h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.dd { font-size: 14px; color: var(--sub); font-variant-numeric: tabular-nums; }
.live-chip { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 50px; border: 1px solid var(--line2); font-size: 13px; color: var(--sub); align-self: center; }
.live-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--done); animation: pulse 2s var(--ease) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.drow { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; min-height: 0; }
.r1 { grid-template-columns: 1fr 1fr; }
.sc { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; align-items: center; gap: 20px; min-width: 0; }
.sc-lead { display: flex; align-items: center; gap: 12px; flex: none; width: 210px; }
.sc-t { margin: 0; font-size: 16px; font-weight: 600; white-space: nowrap; }
.sc-s { margin: 2px 0 0; font-size: 13px; color: var(--sub); white-space: nowrap; }
.sc-cols { flex: 1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); min-width: 0; }
.sc-col { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 2px 8px; border: 0; background: none; color: inherit; font: inherit; min-width: 0; }
.sc-col + .sc-col { border-left: 1px solid var(--line); }
.dash-wrap .sc-cols:has(> .sc-col:nth-child(5)) .sc-col { padding: 2px 4px; }
.dash-wrap .sc-cols:has(> .sc-col:nth-child(5)) .sc-l { font-size: 12px; white-space: nowrap; }
.sc-l { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); white-space: nowrap; }
.sc-v { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sc-col.em .sc-v { color: var(--run); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.d-run { background: var(--run); } .d-wait { background: var(--wait); } .d-stall { background: var(--stall); } .d-off { background: var(--off); } .d-done { background: var(--done); } .d-info { background: var(--info); }
.ic { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.ic svg { width: 22px; height: 22px; }
.pn-h .ic { width: 32px; height: 32px; border-radius: 9px; }
.pn-h .ic svg { width: 17px; height: 17px; }
.ic-run { background: rgba(240,181,69,.14); color: var(--run); }
.ic-info { background: rgba(108,140,255,.16); color: var(--info); }
.ic-done { background: rgba(111,191,146,.14); color: var(--done); }
.ic-wait { background: rgba(232,134,106,.14); color: var(--wait); }
.ic-stall { background: rgba(217,100,91,.14); color: var(--stall); }
.pn { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.pn.c7 { grid-column: span 7; } .pn.c5 { grid-column: span 5; } .pn.c4 { grid-column: span 4; } .pn.c3 { grid-column: span 3; }
.pn-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; min-width: 0; }
.pn-h > b { font-size: 16px; font-weight: 600; white-space: nowrap; }
.pn-h > span { font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pn-h > em { margin-left: auto; font-style: normal; font-size: 13px; color: var(--sub); white-space: nowrap; }
.pn-h > em b { font-size: 15px; font-weight: 600; color: var(--ink); margin-left: 4px; }
.pn-b { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.bignum { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 4px; }
.bignum b { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.bignum span { font-size: 13px; color: var(--sub); }
.chart { flex: 1; min-height: 0; position: relative; }
.chart svg { position: absolute; inset: 0; display: block; }
.chart .gl { stroke: rgba(236,236,238,.06); stroke-dasharray: 3 4; }
.chart .area { fill: rgba(240,181,69,.12); }
.chart .ln { fill: none; stroke: var(--run); stroke-width: 2.2; stroke-linejoin: round; }
.chart .pk { stroke: rgba(240,181,69,.35); stroke-dasharray: 2 3; }
.chart .pkt { font-size: 12px; fill: var(--run); }
.chart .now { fill: var(--run); stroke: var(--panel); stroke-width: 2; }
.chart .now2 { fill: none; stroke: rgba(240,181,69,.35); stroke-width: 1.5; }
.chart .tk { font-size: 12px; fill: var(--sub); } .chart .tk.t { fill: var(--info); font-weight: 600; }
.chart .tk2 { font-size: 11px; fill: var(--dim); }
.chart .pb { fill: rgba(236,236,238,.07); } .chart .pb.t { fill: rgba(108,140,255,.2); }
.chart .ln2 { fill: none; stroke: var(--info); stroke-width: 2.2; }
.chart .pt { fill: var(--panel); stroke: var(--info); stroke-width: 2; } .chart .pt.t { fill: var(--info); }
.chart .vl { font-size: 12px; fill: var(--sub); font-variant-numeric: tabular-nums; } .chart .vl.t { fill: var(--ink); font-weight: 600; }
.gpair { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center; min-height: 0; }
.gpair > div { display: flex; flex-direction: column; align-items: center; min-height: 0; }
.gpair p { margin: -8px 0 0; font-size: 14px; color: var(--sub); text-align: center; }
.gpair p small { display: block; font-size: 12px; color: var(--dim); }
.g-off .gauge { opacity: .45; }
.gauge svg { width: 100%; max-width: 180px; max-height: 170px; display: block; }
.g-big { font-size: 30px; font-weight: 700; fill: var(--ink); }
.g-sm { font-size: 12px; fill: var(--sub); }
.tlist { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 8px; }
.tr2 { display: grid; grid-template-columns: minmax(0, 1fr) auto 48px; gap: 6px 8px; align-items: center; font-size: 14px; }
.tr2 > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbar2 { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: rgba(236,236,238,.06); overflow: hidden; }
.tbar2 i { display: block; height: 100%; border-radius: 3px; background: var(--sub); min-width: 2px; }
.tbar2 i.bad { background: var(--stall); }
.tr2 small { font-size: 12px; color: var(--sub); text-align: right; font-variant-numeric: tabular-nums; }
.tr2 b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.sl { display: flex; flex-direction: column; gap: 4px; flex: 1; justify-content: flex-start; overflow: hidden; }
.si { display: grid; grid-template-columns: 34px minmax(0, 1fr) 92px 56px; gap: 12px; align-items: center; padding: 8px; border-radius: 10px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background .15s var(--ease); }
.si:hover { background: var(--panel2); }
.av.ag-claude, .av.ag-codex { background: color-mix(in srgb, currentColor 16%, transparent); border-color: color-mix(in srgb, currentColor 30%, transparent); }
.sc-tab { position: relative; }
.tact { display: none; position: absolute; top: 6px; right: 6px; gap: 4px; padding-left: 6px; background: var(--panel); }
.tab.sel .tact { background: var(--panel2); }
.sc-tab:hover .tact { display: flex; }
.sc-tab:hover .n1 .stt { visibility: hidden; }
.pinmark { flex: none; display: inline-grid; align-self: center; margin-left: -2px; color: var(--dim); font-style: normal; }
.sc-tab:hover .pinmark { visibility: hidden; }
.tact button { display: grid; place-items: center; width: 24px; height: 22px; padding: 0; border-radius: 6px; border: 1px solid var(--line2); background: var(--hover); color: var(--sub); cursor: pointer; }
.tact button.on { color: var(--run); }
.tact button:hover { color: var(--ink); }
.sc-tab.hid { opacity: .55; }
.hid-toggle { display: block; width: calc(100% - 16px); margin: 16px 8px 4px; padding: 6px 0; font: inherit; font-size: 13px; color: var(--dim); background: none; border: 1px dashed var(--line2); border-radius: 8px; cursor: pointer; }
.hid-toggle:hover { color: var(--sub); }
.sc-tab::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--sc); }
.sc-tab .nm { color: color-mix(in srgb, var(--sc) 55%, var(--ink)); }
.tab.p-off.sc-tab::before { opacity: .4; }
.av.ag-claude svg { width: 72%; height: 72%; }
.av.ag-codex svg { width: 60%; height: 60%; }
.av.nav-dash { color: var(--info); background: rgba(108,140,255,.16); }
.av.nav-sp { color: var(--done); background: rgba(111,191,146,.14); font-weight: 600; }
.av.sm { width: 34px; height: 34px; font-size: 12px; border-radius: 10px; }
.si-m { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.si-n { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.si-w { font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-style: normal; font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 50px; }
.chip.c-run { color: var(--run); background: rgba(240,181,69,.14); } .chip.c-wait { color: var(--wait); background: rgba(232,134,106,.16); } .chip.c-stall { color: var(--stall); background: rgba(217,100,91,.16); }
.chip.c-idle, .chip.c-off { color: var(--sub); background: rgba(236,236,238,.07); }
.si-c { display: flex; flex-direction: column; gap: 4px; }
.meter { height: 5px; border-radius: 3px; background: rgba(236,236,238,.07); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--info); border-radius: 3px; }
.meter i.ctx-run { background: var(--run); } .meter i.ctx-stall { background: var(--stall); }
.ctx-run, .stats .ctx-run b { color: var(--run); } .ctx-stall, .stats .ctx-stall b { color: var(--stall); }
.si-c small, .si-t small { font-size: 11px; color: var(--sub); white-space: nowrap; }
.si-t { display: flex; flex-direction: column; align-items: flex-end; }
.si-t b { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bad { color: var(--stall); } .good { color: var(--done); }
.sl, .tlist { container-type: size; }
@container (max-width: 340px) { .si { grid-template-columns: 34px minmax(0, 1fr) 56px; } .si-c { display: none; } }
@container (max-height: 290px) { .sl .si:nth-child(n+5) { display: none; } }
@container (max-height: 230px) { .sl .si:nth-child(n+4) { display: none; } }
@media (max-width: 1280px) { .dash-wrap { display: flex; flex-direction: column; } .dash-wrap > * { flex: none; } .r1 { grid-template-columns: 1fr; } .pn.c7, .pn.c5, .pn.c4, .pn.c3 { grid-column: span 12; min-height: 260px; } }
.sp-wrap { display: flex; flex-direction: column; gap: 16px; }
.sp-top .sc-cols { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.sc-v small { font-size: 16px; color: var(--sub); font-weight: 500; margin-left: 2px; }
.sp-mid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; }
.pace { display: flex; flex-direction: column; gap: 16px; justify-content: center; flex: 1; }
.pc { display: grid; grid-template-columns: 120px minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: 14px; }
.pc > span { color: var(--sub); }
.pc > b { font-size: 18px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.pbar { position: relative; height: 10px; border-radius: 5px; background: rgba(236,236,238,.07); }
.pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.pbar i.t { background: var(--info); } .pbar i.w { background: var(--done); }
.pbar s { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
.pbar.sm { height: 5px; }
.pnote { margin: 0; font-size: 13px; color: var(--sub); }
.team { display: flex; flex-direction: column; gap: 12px; }
.tm { display: grid; grid-template-columns: 72px minmax(0, 1fr) 210px; gap: 12px; align-items: center; font-size: 14px; }
.tm-n { white-space: nowrap; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; min-width: 6px; }
.stack i { display: block; min-width: 0; }

<script>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

const CHARTS = {

function syncMarkup(root, html) {
  const template=document.createElement("template");template.innerHTML=html;

    if(a.nodeType!==1) { if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
    for(const attr of [...a.attributes]) {
      if(attr.name==="data-focus" || attr.name==="inert" || attr.name==="open" && a.tagName==="DETAILS" && !a.classList.contains("wmenu")) continue;

    }
    while(current) {const next=current.nextSibling;current.remove();current=next;}
  };
  reconcile(root,template.content);
}

    const samePrompt=previous && (previous.promptHash===promptHash || !previous.promptHash && !prompt.trim());
    if(samePrompt && previous.status==='unknown'){setActionMessage(sid,'이전 요청의 접수 여부가 불명확합니다. 실행되지 않은 것을 확인한 뒤 다시 실행을 허용해 주세요.');return;}
    const nonce=samePrompt && (['pending','unknown','held'].includes(previous.status) || Date.now()-previous.at<5000)?previous.id:crypto.randomUUID();
    saveSkillRequest(key,{id:nonce,at:Date.now(),promptHash,status:'pending'});
    ui.skillPreparing=false;await boardAction(action,{skill,prompt,request_id:nonce},sid);
  } catch(e) {setActionMessage(sid,e.message);}
  finally {ui.skillPreparing=false;render();}
}
function actionClick(e) {
  const menu=e.target.closest('[data-skill-menu]'),focus=e.target.closest('[data-focus-session]'),compose=e.target.closest('[data-compose-skill]'),select=e.target.closest('[data-select-skill]'),run=e.target.closest('[data-run-skill]'),fav=e.target.closest('[data-favorite-skill]');
  if(!menu && !focus && !compose && !select && !run && !fav)return;
  e.preventDefault();e.stopImmediatePropagation();
  if(menu){openSkillPicker(menu);return;}
  if(compose){openSkillPicker(compose,compose.dataset.composeSkill);return;}
  const sid=ui.skillsOpen?ui.skillContext.sid:ui.sid===SETTINGS?(ui.actionContext || ''):ui.sid;
  if(focus){boardAction('focus',{},sid);return;}
  if(fav){boardAction('favorite',{skill:fav.dataset.favoriteSkill,enabled:fav.dataset.enabled==='1'},sid);return;}
  if(select && !select.disabled){skillDraft(sid).selected=select.dataset.selectSkill;ui.skillStep='compose';syncSkillDialog();document.querySelector('#skill-prompt')?.focus();return;}
  if(run)runSelectedSkill(run);
}
document.getElementById('main').addEventListener('click',actionClick,true);
const skillDialog=document.getElementById('skill-dialog');
skillDialog.addEventListener('click',actionClick,true);
skillDialog.addEventListener('input',e=>{
  if(e.target.matches('[data-skill-search]')){ui.skillQuery=e.target.value;syncSkillDialog();}
  if(e.target.matches('[data-skill-prompt]')){skillDraft(ui.skillContext.sid).prompt=e.target.value;const count=skillDialog.querySelector('[data-prompt-count]');if(count)count.textContent=e.target.value.length.toLocaleString()+' / 4,000';}
});
skillDialog.addEventListener('keydown',e=>{
  if(e.isComposing || e.keyCode===229)return;
  if((e.metaKey || e.ctrlKey) && e.key==='Enter' && e.target.matches('[data-skill-prompt]')){e.preventDefault();const run=skillDialog.querySelector('[data-run-skill]');if(run)runSelectedSkill(run);return;}
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeSkillPicker();return;}
  if(e.key==='Tab'){
    const items=[...skillDialog.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),[tabindex="0"]')].filter(x=>x.getClientRects().length),first=items[0],last=items.at(-1);
    if(e.shiftKey && document.activeElement===first){e.preventDefault();last?.focus();}
    else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first?.focus();}
  }
},true);
skillDialog.addEventListener('click',e=>{
  const retry=e.target.closest('[data-skill-retry]');
  if(retry && !ui.actionBusy){const action=ui.skillMode==='new'?'launch':'deliver',sid=ui.skillContext.sid,key=action+'|'+sid+'|'+retry.dataset.skillRetry,previous=skillRequests()[key];if(previous?.status==='unknown'){saveSkillRequest(key,{...previous,status:'retry_authorized',at:0});if(ui.deliveries?.[sid]===previous.id)delete ui.deliveries[sid];}setActionMessage(sid,'다시 실행할 준비가 됐습니다. 요청 내용을 확인하고 실행을 눌러 주세요.');syncSkillDialog();return;}
  if(e.target.closest('[data-skill-back]') && !ui.actionBusy && !ui.skillPreparing){ui.skillStep='choose';syncSkillDialog();document.querySelector('[data-skill-search]')?.focus();return;}
  const mode=e.target.closest('[data-skill-mode]');if(mode && !ui.actionBusy && !ui.skillPreparing){ui.skillMode=mode.dataset.skillMode;syncSkillDialog();return;}
  if(e.target.closest('[data-skill-close]')){closeSkillPicker();return;}
  if(e.target===skillDialog){const r=skillDialog.getBoundingClientRect();if(e.clientX<r.left || e.clientX>r.right || e.clientY<r.top || e.clientY>r.bottom)closeSkillPicker();}
});
skillDialog.addEventListener('close',()=>{ui.skillsOpen=false;ui.skillContext=null;render();(ui.skillReturn?.isConnected?ui.skillReturn:document.querySelector('[data-skill-menu]'))?.focus();});

document.getElementById("main").addEventListener("submit",e=>{
  if(!e.target.matches('[data-action-settings]'))return;
  e.preventDefault();const form=e.target;
  boardAction('configure',{settings:{auto_servers:form.elements.auto_servers.checked,auto_terminal:form.elements.auto_terminal.checked,launch_app:form.elements.launch_app.value.trim()}},'');
});
document.getElementById("main").addEventListener("change",e=>{
  if(e.target.matches('[data-settings-session]')){ui.actionContext=e.target.value;ui.skillQuery='';render(true);}
});
document.getElementById("main").addEventListener("click",async e=>{
  if(!e.target.closest('[data-copy-action-guide]'))return;
  const guide=ui.actionData?.[ui.actionContext || '']?.guide;if(!guide)return;
  try{await navigator.clipboard.writeText(guide);document.querySelector('[data-copy-feedback]').textContent='복사했습니다. AI 대화에 붙여 넣어 주세요.';}
  catch(error){const area=document.querySelector('.settings-guide');area.closest('details').open=true;area.focus();area.select();document.querySelector('[data-copy-feedback]').textContent='선택한 도움말을 복사해 주세요.';}
});

async function alias(src, dst) {
  try { await fetch("/api/alias", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({src, dst})}); } catch (e) {}
  lastKey = ""; ui.work = {}; refresh();
}
document.getElementById("main").addEventListener("change", e => {
  const sel = e.target.closest("[data-mergeinto]");
  if (sel && sel.value) alias(sel.dataset.mergeinto, sel.value);
});
document.getElementById("main").addEventListener("click", e => {
  const b = e.target.closest("[data-unmerge]");
  if (b) { e.stopPropagation(); alias(b.dataset.unmerge, b.dataset.auto === "1" ? b.dataset.unmerge : ""); }
}, true);

async function refresh() {
  try {
    const r = await fetch("/api/sessions", {cache: "no-store"});
    if (!r.ok) throw new Error("sessions unavailable");
    const d = await r.json();
    offset = d.now - Date.now() / 1000;
    const key = JSON.stringify([d.sessions, d.sprint, d.usage]);
    data = d;
    if (key !== lastKey) { lastKey = key; render(); }
  } catch (e) {
    data = null;
    document.querySelector("aside").inert = false;
    lastKey = "";
    for (const id of ["n-wait", "n-run", "n-stall"]) document.getElementById(id).textContent = "–";
    document.getElementById("tabs").innerHTML = "";
    document.getElementById("main").innerHTML = `<div class="empty" role="alert"><h1>Forkrail에 연결할 수 없습니다</h1><p>3초마다 다시 연결합니다. 계속 표시되면 Forkrail 서비스가 실행 중인지 확인해 주세요.</p><button class="text-button" data-retry>지금 다시 연결</button></div>`;
  }
}

document.addEventListener('click',async e=>{
  if(e.target.closest('[data-retry]')){refresh();return;}
  if(e.target.closest('[data-open-settings]')){ui.sid=SETTINGS;ui.stage=null;ui.req=null;ui.menu=false;store.set('wb.sid',ui.sid);rememberNavigation();render();document.getElementById('main').scrollTop=0;return;}
  const tab=e.target.closest('[data-settings-tab]');if(tab){ui.settingsTab=tab.dataset.settingsTab;render(true);return;}
  if(ui.actionBusy)return;
  if(e.target.closest('[data-connection-retry]')){await loadActionCatalog('',true);return;}
  if(e.target.closest('[data-settings-retry]')){await loadActionCatalog(ui.actionContext || '',true);return;}
  const edit=e.target.closest('[data-connection-edit]');if(edit){openConnection(edit.dataset.connectionEdit);render();return;}
  if(e.target.closest('[data-connection-add]')){const row=connectionRows().find(x=>!x.registered);if(row)openConnection(row.kind,true);render();return;}
  if(e.target.closest('[data-connection-cancel]')){ui.connectionEdit=null;render();return;}
  const check=e.target.closest('[data-connection-check]');if(check){await boardAction('connection_check',{kind:check.dataset.connectionCheck},'');return;}
  const login=e.target.closest('[data-connection-login]');if(login){await boardAction('connection_login',{kind:login.dataset.connectionLogin,switch:login.dataset.loginSwitch==='1',request_id:crypto.randomUUID()},'');return;}
  const remove=e.target.closest('[data-connection-remove]');if(remove){ui.connectionRemove=remove.dataset.connectionRemove;render();return;}
  if(e.target.closest('[data-connection-keep]')){ui.connectionRemove=null;render();return;}
  const confirm=e.target.closest('[data-connection-confirm]');if(confirm){await boardAction('connection_remove',{kind:confirm.dataset.connectionConfirm},'');return;}
});
document.getElementById('main').addEventListener('input',e=>{
  const key=e.target.dataset.connectionField;
  if(key && ui.connectionDraft){const field=connectionRows().find(x=>x.kind===ui.connectionEdit)?.fields.find(x=>x.key===key);ui.connectionDraft[key]=key==='enabled'?e.target.checked:field?.type==='paths'?e.target.value.split('\n').filter(x=>x.trim()):e.target.value;}
  if(e.target.closest('[data-action-settings]')){const form=e.target.closest('form');ui.environmentDraft={auto_servers:form.elements.auto_servers.checked,auto_terminal:form.elements.auto_terminal.checked,launch_app:form.elements.launch_app.value};}
});
document.getElementById('main').addEventListener('change',e=>{
  if(e.target.matches('[data-connection-kind]')){openConnection(e.target.value,true);render(true);}
});
document.getElementById('main').addEventListener('submit',e=>{
  if(e.target.matches('[data-connection-form]')){
    e.preventDefault();const values={},expected={};
    for(const [key,value] of Object.entries(ui.connectionDraft))if(JSON.stringify(value)!==JSON.stringify(ui.connectionOriginal?.[key])){values[key]=value;expected[key]=ui.connectionOriginal[key];}
    boardAction('connection_save',{kind:ui.connectionEdit,values,expected},'');
  }
});

setInterval(() => { if(ui.sid===SETTINGS && data)loadActionCatalog(ui.actionContext || ''); if (!window.getSelection().toString()) render(); }, 10000);
rememberNavigation(true);
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
